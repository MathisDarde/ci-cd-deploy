services:
  workspace:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pokewishlist
      POSTGRES_PASSWORD: pokewishlist
      POSTGRES_DB: pokewishlist
    volumes:
      - devcontainer-db:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ../db/create-test-db.sql:/docker-entrypoint-initdb.d/002_test_db.sql:ro

volumes:
  devcontainer-db:
