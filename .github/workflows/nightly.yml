name: Nightly

# Every night, no time limit: mutation testing, load test, DAST and the full E2E suite.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Injects bugs into the business rules: a surviving mutant = a test that checks nothing.
      - run: pnpm --filter @pokewishlist/shared test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/shared/reports/mutation
          retention-days: 14

  e2e-full:
    name: Full E2E (all projects)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pokewishlist_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/pokewishlist_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  load:
    name: Load test (k6, staging)
    # Needs the repository variables STG_API_URL and STG_SSR_URL.
    if: vars.STG_API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run tests/load/browse.js
        env:
          API_URL: ${{ vars.STG_API_URL }}
          SSR_URL: ${{ vars.STG_SSR_URL }}

  dast:
    name: DAST (OWASP ZAP baseline, staging)
    if: vars.STG_SSR_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.STG_SSR_URL }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
