name: Rollback

# Back to the previous stable version, without rebuilding the API:
#   - API: the Lambda alias "live" points back to the previous published version (instant);
#   - SSR: Vercel promotes the previous production deployment (instant);
#   - SSG: the static site is regenerated from the last stable deploy tag.
# Then the smoke tests confirm the site works.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [prd]
        default: prd
      lambda_version:
        description: Lambda version to restore (empty = the one before the current)
        required: false
      tag:
        description: Stable deploy tag for the static site (empty = the one before the latest)
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
    env:
      ENV_NAME: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Read infrastructure outputs
        id: tf
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=pokewishlist/${ENV_NAME}.tfstate" \
            -backend-config="region=${AWS_REGION}" > /dev/null
          {
            echo "api_url=$(terraform output -raw api_url)"
            echo "function=$(terraform output -raw lambda_function_name)"
            echo "bucket=$(terraform output -raw front_bucket)"
            echo "distribution=$(terraform output -raw cloudfront_distribution_id)"
            echo "front_url=$(terraform output -raw front_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Identify the last stable versions
        id: stable
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
        run: |
          current=$(aws lambda get-alias --function-name "$FUNCTION" --name live --query FunctionVersion --output text)
          target="${{ inputs.lambda_version }}"
          if [ -z "$target" ]; then
            # The highest published version below the current one.
            target=$(aws lambda list-versions-by-function --function-name "$FUNCTION" \
              --query "Versions[?Version!='\$LATEST'].Version" --output text \
              | tr '\t' '\n' | sort -n | awk -v cur="$current" '$1 < cur' | tail -1)
          fi
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(git tag --list "deploy-${ENV_NAME}-*" --sort=-creatordate | sed -n 2p)
          fi
          [ -n "$target" ] || { echo "::error::No previous Lambda version"; exit 1; }
          echo "lambda=$target" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Rollback of ${ENV_NAME}"
            echo "- API: Lambda version $current → $target"
            echo "- SSG: rebuilt from \`${tag:-<no previous tag, unchanged>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back the API
        run: |
          aws lambda update-alias --function-name "${{ steps.tf.outputs.function }}" \
            --name live --function-version "${{ steps.stable.outputs.lambda }}"

      - name: Roll back the SSR front (Vercel)
        if: inputs.environment == 'prd'
        run: npx --yes vercel@latest rollback --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Checkout the stable tag
        if: steps.stable.outputs.tag != ''
        run: git checkout "${{ steps.stable.outputs.tag }}"

      - uses: ./.github/actions/setup
        if: steps.stable.outputs.tag != ''

      - name: Regenerate and upload the stable static site
        if: steps.stable.outputs.tag != ''
        env:
          NUXT_PUBLIC_API_BASE: ${{ steps.tf.outputs.api_url }}
          NUXT_PUBLIC_SITE_URL: ${{ steps.tf.outputs.front_url }}
          NUXT_PUBLIC_I18N_BASE_URL: ${{ steps.tf.outputs.front_url }}
          NUXT_PUBLIC_APP_VERSION: ${{ steps.stable.outputs.tag }}
        run: |
          pnpm --filter @pokewishlist/web generate
          aws s3 sync apps/web/.output/public "s3://${{ steps.tf.outputs.bucket }}" --delete
          aws cloudfront create-invalidation --distribution-id "${{ steps.tf.outputs.distribution }}" --paths "/*" > /dev/null

      - name: Smoke tests after rollback
        run: node scripts/smoke.mjs
        env:
          API_URL: ${{ steps.tf.outputs.api_url }}
          SSG_URL: ${{ steps.tf.outputs.front_url }}
          SSR_URL: ${{ vars.SSR_URL }}
          SMOKE_ATTEMPTS: '10'
